<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KollinXD</title>
    <style>
        /* Import pixel font */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('https://r2.guns.lol/9da789e2-7254-45c1-a9cf-6038fc3eae4b.webp') 16 16, auto !important;
        }
        
        ::-moz-selection {
            background: #ff3b3b;
            color: #2a0f0f;
        }
        
        ::selection {
            background: #ff3b3b;
            color: #2a0f0f;
        }
        
        body {
            font-family: 'VT323', monospace;
            background-color: #2a0f0f;
            color: #ff3b3b;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
        }
        
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.7;
            filter: hue-rotate(120deg) contrast(1.2);
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(42, 15, 15, 0.7), rgba(80, 20, 20, 0.5));
            z-index: -1;
        }
        
        .container {
            max-width: 40rem;
            width: 90%;
            background-color: rgba(60, 15, 15, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            padding: 25px;
            margin: 20px;
            box-shadow: 0 0 20px rgba(255, 30, 30, 0.3), 
                        inset 0 0 20px rgba(255, 30, 30, 0.1);
            border: 2px solid rgba(255, 60, 60, 0.2);
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1);
            transition: 700ms cubic-bezier(0.03, 0.98, 0.52, 0.99);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff3b3b, transparent);
            animation: scanline 3s linear infinite;
        }
        
        @keyframes scanline {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .avatar-container {
            position: relative;
            margin-bottom: 15px;
        }
        
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 3px solid rgba(255, 60, 60, 0.6);
            object-fit: cover;
            box-shadow: 0 0 30px rgba(255, 30, 30, 0.7);
            filter: sepia(0.3) hue-rotate(-30deg) saturate(1.2);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }
        
        .avatar-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 59, 59, 0.4) 0%, rgba(255, 59, 59, 0) 70%);
            filter: blur(10px);
            z-index: 1;
            animation: pulse-glow 2s infinite alternate;
        }
        
        @keyframes pulse-glow {
            0% { opacity: 0.5; }
            100% { opacity: 0.8; }
        }
        
        .username-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }
        
        .username {
            font-size: 36px;
            font-weight: 600;
            text-shadow: 0px 0px 16.5px #ff3b3b;
            font-family: 'Press Start 2P', cursive;
            letter-spacing: 2px;
        }
        
        .badges {
            display: flex;
            gap: 10px;
        }
        
        .badge {
            width: 28px;
            height: 28px;
            color: #ff5a5a;
            filter: drop-shadow(#ff5a5a 0 0 5px);
            transition: all 0.3s ease;
        }
        
        .badge:hover {
            transform: scale(1.2);
            filter: drop-shadow(#ff5a5a 0 0 10px);
        }
        
        .description {
            font-size: 20px;
            font-weight: 570;
            opacity: 0.9;
            margin-top: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 59, 59, 0.5);
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background-color: rgba(255, 60, 60, 0.22);
            border: 2px solid rgba(255, 60, 60, 0.12);
            transition: all 0.3s ease;
            color: #ff5a5a;
            filter: drop-shadow(#ff5a5a 1px 0 7px);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }
        
        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .social-link:hover::before {
            left: 100%;
        }
        
        .social-link:hover {
            background-color: rgba(255, 60, 60, 0.32);
            border: 2px solid rgba(255, 60, 60, 0.5);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 30, 30, 0.4);
        }
        
        .audio-player {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(60, 15, 15, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(255, 60, 60, 0.2);
        }
        
        .audio-icon {
            color: #ff5a5a;
            filter: drop-shadow(#ff5a5a 1px 0 7px);
        }
        
        .audio-controls {
            flex-grow: 1;
        }
        
        .audio-title {
            font-size: 16px;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 60, 60, 0.3);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ff3b3b, #ff6b6b);
            width: 45%;
            border-radius: 3px;
            position: relative;
        }
        
        .progress::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.7; }
            100% { opacity: 0.3; }
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: rgba(60, 15, 15, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 60, 60, 0.1);
        }
        
        .volume-icon {
            color: #ff5a5a;
        }
        
        .volume-slider {
            flex-grow: 1;
            height: 6px;
            background-color: rgba(255, 60, 60, 0.35);
            border-radius: 3px;
            position: relative;
        }
        
        .volume-level {
            height: 100%;
            background: linear-gradient(90deg, #ff3b3b, #ff6b6b);
            width: 80%;
            border-radius: 3px;
        }
        
        .welcome-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            text-shadow: 0 0 10px rgba(255, 60, 60, 0.7);
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 10;
        }
        
        .pixel-border {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        
        .pixel-border::before, .pixel-border::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #ff3b3b;
        }
        
        .pixel-border::before {
            top: -2px;
            left: -2px;
            box-shadow: 
                8px 0 0 #ff3b3b,
                16px 0 0 #ff3b3b,
                24px 0 0 #ff3b3b,
                0 8px 0 #ff3b3b,
                0 16px 0 #ff3b3b,
                0 24px 0 #ff3b3b;
        }
        
        .pixel-border::after {
            bottom: -2px;
            right: -2px;
            box-shadow: 
                -8px 0 0 #ff3b3b,
                -16px 0 0 #ff3b3b,
                -24px 0 0 #ff3b3b,
                0 -8px 0 #ff3b3b,
                0 -16px 0 #ff3b3b,
                0 -24px 0 #ff3b3b;
        }
        
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #ff3b3b;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.8;
            box-shadow: 0 0 10px #ff3b3b;
        }
        
        .glitch-text {
            position: relative;
            display: inline-block;
        }
        
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #00ffff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        
        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #ff00ff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }
        
        @keyframes glitch-anim {
            0% { clip: rect(42px, 9999px, 44px, 0); }
            5% { clip: rect(12px, 9999px, 59px, 0); }
            10% { clip: rect(48px, 9999px, 29px, 0); }
            15% { clip: rect(42px, 9999px, 73px, 0); }

            60% { clip: rect(82px, 9999px, 31px, 0); }

            95% { clip: rect(42px, 9999px, 97px, 0); }
            100% { clip: rect(38px, 9999px, 49px, 0); }
        }
        
        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 20px;
            }
            
            .username {
                font-size: 28px;
            }
            
            .avatar {
                width: 140px;

            }
            
            .avatar-glow {
                width: 160px;
                height: 160px;
            }
            
            .welcome-message {
                font-size: 30px;
            }
        }
    </style>

    <script>
        // Welcome message animation
        document.addEventListener('DOMContentLoaded', function() {
            const welcomeMessage = document.querySelector('.welcome-message');
            
            setTimeout(() => {
                welcomeMessage.style.opacity = '1';
            }, 500);
            
            setTimeout(() => {
                welcomeMessage.style.opacity = '0';
            }, 2500);
            
            // Audio controls
            const audio = document.getElementById('background-audio');
            const progressBar = document.querySelector('.progress');
            const volumeSlider = document.querySelector('.volume-level');
            
            // Play audio after user interaction
            document.addEventListener('click', function() {
                if (audio.paused) {
                    audio.play().catch(e => console.log('Audio play failed:', e));
                }
            }, { once: true });
            
            // Update progress bar
            audio.addEventListener('timeupdate', function() {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = progress + '%';
            });
            
            // Volume control
            volumeSlider.style.width = '80%'; // Initial volume
            
            // Create fairy dust cursor effect
            document.addEventListener('mousemove', function(e) {
                if (Math.random() > 0.7) {
                    createParticle(e.clientX, e.clientY);
                }
            });
            
            function createParticle(x, y) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                document.body.appendChild(particle);
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                const duration = Math.random() * 1000 + 500;
                
                particle.animate([
                    { transform: 'translate(0, 0)', opacity: 0.8 },
                    { transform: `translate(${Math.random() * 40 - 20}px, ${Math.random() * 40 - 20}px)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'ease-out'
                });
                
                setTimeout(() => {
                    particle.remove();
                }, duration);
            }
            
            // Parallax effect on container
            document.addEventListener('mousemove', function(e) {
                const container = document.querySelector('.container');
                const x = (e.clientX / window.innerWidth) * 20 - 10;
                const y = (e.clientY / window.innerHeight) * 20 - 10;
                
                container.style.transform = `perspective(1000px) rotateX(${y}deg) rotateY(${x}deg) scale3d(1, 1, 1)`;
            });
            
            // Glitch effect on username
            const glitchText = document.querySelector('.glitch-text');
            setInterval(() => {
                glitchText.style.animation = 'none';
                setTimeout(() => {
                    glitchText.style.animation = '';
                }, 10);
            }, 5000);
            
            // Avatar hover effect
            const avatar = document.querySelector('.avatar');
            avatar.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.05)';
                this.style.boxShadow = '0 0 40px rgba(255, 30, 30, 0.8)';
            });
            
            avatar.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = '0 0 30px rgba(255, 30, 30, 0.7)';
            });
        });
    </script>
</body>
</html>
